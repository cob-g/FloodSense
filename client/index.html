<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FloodSense - Real-time flood monitoring and reporting for North Caloocan. Community-driven flood alerts powered by IoT sensors." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />

    <!-- Preload critical fonts -->
    <link rel="preload" href="/fonts/goodly-regular.otf" as="font" type="font/otf" crossorigin />

    <!-- Preload LCP image for faster rendering -->
    <link rel="preload" href="/FS1.png" as="image" type="image/png" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0a0a12" />

    <title>FloodSense - Community Flood Monitoring</title>

    <!-- Inline critical CSS for faster FCP -->
    <style>
      /* Critical CSS - shows loading state before JS loads */
      body {
        margin: 0;
        background-color: #0a0a12;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
      /* Initial loading spinner - centered with positioning */
      .initial-loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 94, 26, 0.2);
        border-top-color: #ff5e1a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loader shown before React hydrates -->
      <div class="initial-loader" aria-label="Loading"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
